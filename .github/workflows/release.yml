# Builds downloadable macOS (universal: Intel + Apple Silicon) and Windows
# packages, and — only when you deliberately opt in — publishes them to
# itch.io. This is the Windows build path: a native Windows runner does the
# compile, so no local cross-compilation (impossible with a Homebrew Rust
# toolchain) and no second machine are needed.
#
# HOW TO USE
#   * Every push to `main` and every run you trigger by hand (Actions tab →
#     "Build & Release" → "Run workflow") builds both platforms and attaches
#     the zips to the run as downloadable artifacts. Nothing is published.
#   * To publish to itch.io, do BOTH of these once:
#       1. Add a repository secret BUTLER_API_KEY (Settings → Secrets and
#          variables → Actions). Get the key from `butler login` locally, or
#          from https://itch.io/user/settings/api-keys.
#       2. Set ITCH_TARGET below to "<your-itch-username>/<your-game-slug>".
#     Then push a version tag (e.g. `git tag v0.1.0 && git push origin
#     v0.1.0`). The publish job runs ONLY on `v*` tags AND only when the
#     secret exists, so it can never publish by accident.

name: Build & Release

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    tags: ['v*']

env:
  # Set to "<username>/<game-slug>" to enable itch.io publishing on tags.
  ITCH_TARGET: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS builds both arches so `lipo` can fuse a universal binary;
          # Windows uses the runner's default MSVC target.
          targets: ${{ matrix.platform == 'macos' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: cargo build --release

      - name: Build (macOS universal)
        if: matrix.platform == 'macos'
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/sandbox_world \
            target/x86_64-apple-darwin/release/sandbox_world \
            target/aarch64-apple-darwin/release/sandbox_world
          strip target/release/sandbox_world

      - name: Package (macOS .app)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          APP="stage/Sandbox World.app"
          mkdir -p "$APP/Contents/MacOS" dist
          cp target/release/sandbox_world "$APP/Contents/MacOS/"
          # ASSET PATH CONTRACT: bevy_asset resolves `assets/` against
          # current_exe().parent() (see bevy_asset io/file/mod.rs
          # get_base_path), so assets must sit BESIDE the binary in
          # Contents/MacOS. The idiomatic Contents/Resources location ships an
          # app that launches to a window and then finds no assets at all.
          cp -R assets "$APP/Contents/MacOS/"
          find stage -name '.DS_Store' -delete
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Sandbox World</string>
            <key>CFBundleDisplayName</key><string>Sandbox World</string>
            <key>CFBundleExecutable</key><string>sandbox_world</string>
            <key>CFBundleIdentifier</key><string>org.ewtco.sandboxworld</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <!-- Without this macOS runs the game at 1x and upscales it, which
                 on a Retina display looks materially blurrier. -->
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # ditto, not plain zip: actions/upload-artifact does not preserve the
          # executable bit, so shipping the .app bare would download as a
          # non-runnable bundle. An inner archive carries the mode bits through.
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/sandbox_world-macos.zip

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p stage/sandbox_world dist
          cp target/release/sandbox_world.exe stage/sandbox_world/
          # Same asset contract as macOS: next to the executable.
          cp -R assets stage/sandbox_world/
          (cd stage && 7z a -tzip -mx=9 ../dist/sandbox_world-windows.zip sandbox_world > /dev/null)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sandbox_world-${{ matrix.platform }}
          path: dist/*.zip

  publish:
    # Publishes to itch.io ONLY on a version tag AND only if BUTLER_API_KEY
    # is set. Adding this workflow alone never publishes anything.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to itch.io via butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_TARGET" ]; then
            echo "BUTLER_API_KEY secret or ITCH_TARGET not set — skipping itch.io upload."
            exit 0
          fi
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          VERSION="${GITHUB_REF_NAME#v}"
          # The artifacts are zips (see the packaging steps, which archive so
          # the executable bit survives upload-artifact). butler wants a
          # directory, so unpack first — unzip restores the stored mode bits.
          mkdir -p push/mac push/windows
          unzip -q artifacts/sandbox_world-macos/sandbox_world-macos.zip     -d push/mac
          unzip -q artifacts/sandbox_world-windows/sandbox_world-windows.zip -d push/windows
          ./butler push push/mac     "$ITCH_TARGET:mac"     --userversion "$VERSION"
          ./butler push push/windows "$ITCH_TARGET:windows" --userversion "$VERSION"
